<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 410" width="1240" height="410">
  <defs>
    <style type="text/css"><![CDATA[
  .uml-box { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
  .uml-divider { stroke: #000000; stroke-width: 1.5; }
  .stereotype { font-size: 11px; font-style: italic; fill: #333333; text-anchor: middle; font-family: 'Segoe UI', Arial, sans-serif; }
  .class-title { font-size: 14px; font-weight: 700; fill: #000000; text-anchor: middle; font-family: 'Segoe UI', Arial, sans-serif; }
  .member-text { font-size: 12px; fill: #000000; font-family: 'Consolas', 'Courier New', monospace; font-weight: 500; }
  .conn-line { stroke: #000000; stroke-width: 1.4; fill: none; stroke-linejoin: miter; }
  .conn-dashed { stroke: #000000; stroke-width: 1.4; fill: none; stroke-dasharray: 6, 4; stroke-linejoin: miter; }
  .multiplicity { font-size: 11px; font-weight: 600; fill: #000000; font-family: 'Segoe UI', Arial, sans-serif; }
  .label-bg { fill: #ffffff; }
  .rel-label { font-size: 11px; font-weight: 500; fill: #000000; font-family: 'Segoe UI', Arial, sans-serif; text-anchor: middle; }
    ]]></style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="410" fill="#ffffff" />

  <!-- RELATIONSHIPS -->
  <path d="M 330 195 L 430 195" class="conn-line" />
  <rect x="346.0" y="202.0" width="68.0" height="18" class="label-bg" />
  <text x="380.0" y="215.0" class="rel-label">lượt đổi</text>
  <text x="340" y="185" class="multiplicity">1</text>
  <text x="402" y="185" class="multiplicity">0..*</text>
  <path d="M 790 195 L 890 195" class="conn-line" />
  <rect x="786.5" y="202.0" width="107.0" height="18" class="label-bg" />
  <text x="840.0" y="215.0" class="rel-label">giao dịch điểm</text>
  <text x="798" y="185" class="multiplicity">0..1</text>
  <text x="862" y="185" class="multiplicity">0..*</text>

  <!-- UML CLASSES -->
  <g id="class-RewardProduct">
    <rect x="40" y="110" width="290" height="186" class="uml-box" rx="2" />
    <line x1="40" y1="144" x2="330" y2="144" class="uml-divider" />
    <line x1="40" y1="272" x2="330" y2="272" class="uml-divider" />
    <text x="185.0" y="132" class="class-title">RewardProduct</text>
    <text x="54" y="166" class="member-text">+ id: UUID (PK)</text>
    <text x="54" y="184" class="member-text">+ productSizeId: UUID (FK, unique)</text>
    <text x="54" y="202" class="member-text">+ pointsRequired: Int</text>
    <text x="54" y="220" class="member-text">+ isActive: Boolean = true</text>
    <text x="54" y="238" class="member-text">+ createdAt: DateTime</text>
    <text x="54" y="256" class="member-text">+ updatedAt: DateTime</text>
  </g>
  <g id="class-RewardRedemption">
    <rect x="430" y="40" width="360" height="312" class="uml-box" rx="2" />
    <line x1="430" y1="74" x2="790" y2="74" class="uml-divider" />
    <line x1="430" y1="328" x2="790" y2="328" class="uml-divider" />
    <text x="610.0" y="62" class="class-title">RewardRedemption</text>
    <text x="444" y="96" class="member-text">+ id: UUID (PK)</text>
    <text x="444" y="114" class="member-text">+ userId: UUID (FK)</text>
    <text x="444" y="132" class="member-text">+ idempotencyKey: UUID?</text>
    <text x="444" y="150" class="member-text">+ rewardProductId: UUID (FK)</text>
    <text x="444" y="168" class="member-text">+ orderId: UUID? (FK)</text>
    <text x="444" y="186" class="member-text">+ productNameSnapshot: String</text>
    <text x="444" y="204" class="member-text">+ sizeSnapshot: DrinkSize</text>
    <text x="444" y="222" class="member-text">+ pointsRequiredSnapshot: Int</text>
    <text x="444" y="240" class="member-text">+ quantity: Int = 1</text>
    <text x="444" y="258" class="member-text">+ totalPointsSpent: Int</text>
    <text x="444" y="276" class="member-text">+ status: RewardRedemptionStatus = PENDING</text>
    <text x="444" y="294" class="member-text">+ createdAt: DateTime</text>
    <text x="444" y="312" class="member-text">+ updatedAt: DateTime</text>
  </g>
  <g id="class-LoyaltyTransaction">
    <rect x="890" y="95" width="300" height="222" class="uml-box" rx="2" />
    <line x1="890" y1="129" x2="1190" y2="129" class="uml-divider" />
    <line x1="890" y1="293" x2="1190" y2="293" class="uml-divider" />
    <text x="1040.0" y="117" class="class-title">LoyaltyTransaction</text>
    <text x="904" y="151" class="member-text">+ id: UUID (PK)</text>
    <text x="904" y="169" class="member-text">+ userId: UUID (FK)</text>
    <text x="904" y="187" class="member-text">+ orderId: UUID? (FK)</text>
    <text x="904" y="205" class="member-text">+ rewardRedemptionId: UUID? (FK)</text>
    <text x="904" y="223" class="member-text">+ pointsChange: Int</text>
    <text x="904" y="241" class="member-text">+ type: LoyaltyTransactionType</text>
    <text x="904" y="259" class="member-text">+ description: String?</text>
    <text x="904" y="277" class="member-text">+ createdAt: DateTime</text>
  </g>
</svg>