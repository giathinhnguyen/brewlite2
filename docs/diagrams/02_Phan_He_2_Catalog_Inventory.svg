    <text x="54" y="346" class="member-text">- id: UUID [PK]</text>
    <text x="54" y="364" class="member-text">- categoryId: UUID [FK]</text>
    <text x="54" y="382" class="member-text">- name: String</text>
    <text x="54" y="400" class="member-text">- description: String?</text>
    <text x="54" y="418" class="member-text">- basePrice: Decimal</text>
    <text x="54" y="436" class="member-text">- imageUrl: String?</text>
    <text x="54" y="454" class="member-text">- isActive: boolean</text>
    <text x="54" y="492" class="member-text">+ findAll(): Product[]</text>
    <text x="54" y="510" class="member-text">+ findOne(id: UUID): Product</text>
    <text x="54" y="528" class="member-text">+ product(id: UUID, body): Product</text>
  </g>
  <g id="class-ProductSize">
    <rect x="400" y="290" width="332" height="200" class="uml-box" rx="2" />
    <line x1="400" y1="324" x2="732" y2="324" class="uml-divider" />
    <line x1="400" y1="452" x2="732" y2="452" class="uml-divider" />
    <text x="566.0" y="312" class="class-title">ProductSize</text>
    <text x="414" y="346" class="member-text">- id: UUID [PK]</text>
    <text x="414" y="364" class="member-text">- productId: UUID [FK]</text>
    <text x="414" y="382" class="member-text">- size: DrinkSize</text>
    <text x="414" y="400" class="member-text">- priceAdjustment: Decimal</text>
    <text x="414" y="418" class="member-text">- cupVolumeMl: int?</text>
    <text x="414" y="436" class="member-text">- isActive: boolean</text>
    <text x="414" y="474" class="member-text">+ availability(tx, sizeIds): SizeAvail[]</text>
  </g>
  <g id="class-ProductIngredient">
    <rect x="790" y="290" width="340" height="182" class="uml-box" rx="2" />
    <line x1="790" y1="324" x2="1130" y2="324" class="uml-divider" />
    <line x1="790" y1="416" x2="1130" y2="416" class="uml-divider" />
