    <text x="1224" y="676" class="member-text">- ingredientId: UUID [PK,FK]</text>
    <text x="1224" y="694" class="member-text">- onHand: Decimal(14,3)</text>
    <text x="1224" y="712" class="member-text">- reserved: Decimal(14,3)</text>
    <text x="1224" y="730" class="member-text">- updatedAt: DateTime</text>
    <text x="1224" y="768" class="member-text">+ assertAvailable(tx, lines): void</text>
    <text x="1224" y="786" class="member-text">+ reserve(tx, orderId: UUID, lines): void</text>
    <text x="1224" y="804" class="member-text">+ settle(tx, orderId: UUID, action): void</text>
