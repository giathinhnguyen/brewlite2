    <text x="1224" y="364" class="member-text">- code: String(10) [UK]</text>
    <text x="1224" y="382" class="member-text">- name: String(120)</text>
    <text x="1224" y="400" class="member-text">- unit: String(5)</text>
    <text x="1224" y="418" class="member-text">- unitCostVnd: Decimal(14,4)</text>
    <text x="1224" y="436" class="member-text">- reorderLevel: Decimal(14,3)</text>
    <text x="1224" y="454" class="member-text">- isActive: boolean</text>
