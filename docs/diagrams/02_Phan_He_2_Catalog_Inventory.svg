  <g id="class-Category">
    <rect x="40" y="40" width="240" height="182" class="uml-box" rx="2" />
    <line x1="40" y1="74" x2="280" y2="74" class="uml-divider" />
    <line x1="40" y1="184" x2="280" y2="184" class="uml-divider" />
