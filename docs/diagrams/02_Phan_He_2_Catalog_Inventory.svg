    <text x="54" y="676" class="member-text">- id: UUID [PK]</text>
    <text x="54" y="694" class="member-text">- name: String [UK]</text>
    <text x="54" y="712" class="member-text">- price: Decimal</text>
    <text x="54" y="730" class="member-text">- isActive: boolean</text>
    <text x="54" y="768" class="member-text">+ findAll(): Topping[]</text>
