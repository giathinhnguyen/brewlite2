  <g id="class-IngredientStock">
    <rect x="1210" y="620" width="340" height="200" class="uml-box" rx="2" />
    <line x1="1210" y1="654" x2="1550" y2="654" class="uml-divider" />
    <line x1="1210" y1="746" x2="1550" y2="746" class="uml-divider" />
