    <text x="404" y="96" class="member-text">- productSizeId: UUID [PK,FK]</text>
    <text x="404" y="114" class="member-text">- axis: CustomizationAxis [PK]</text>
    <text x="404" y="132" class="member-text">- allowedLevels: int[]</text>
    <text x="404" y="150" class="member-text">- defaultLevel: int = 100</text>
    <text x="404" y="168" class="member-text">- policyNote: String?</text>
    <text x="404" y="206" class="member-text">+ findPolicies(sizeId: UUID): Policy[]</text>
  </g>
  <g id="class-Product">
    <rect x="40" y="290" width="290" height="254" class="uml-box" rx="2" />
    <line x1="40" y1="324" x2="330" y2="324" class="uml-divider" />
    <line x1="40" y1="470" x2="330" y2="470" class="uml-divider" />
