    <text x="804" y="364" class="member-text">- ingredientId: UUID [PK,FK]</text>
    <text x="804" y="382" class="member-text">- quantity: Decimal(14,3)</text>
    <text x="804" y="400" class="member-text">- adjustmentGroup: IngredientAdjustment</text>
    <text x="804" y="438" class="member-text">+ recipe(sizeId: UUID, body): void</text>
    <text x="804" y="456" class="member-text">+ requirements(tx, lines): Requirement[]</text>
