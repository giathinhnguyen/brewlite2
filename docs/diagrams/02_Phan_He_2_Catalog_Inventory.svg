    <text x="54" y="96" class="member-text">- id: UUID [PK]</text>
    <text x="54" y="114" class="member-text">- name: String [UK]</text>
    <text x="54" y="132" class="member-text">- slug: String [UK]</text>
    <text x="54" y="150" class="member-text">- displayOrder: int</text>
    <text x="54" y="168" class="member-text">- isActive: boolean</text>
    <text x="54" y="206" class="member-text">+ findAll(): Category[]</text>
  </g>
  <g id="class-CustomizationPolicy">
