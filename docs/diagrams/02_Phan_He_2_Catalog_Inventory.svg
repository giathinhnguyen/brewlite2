  <g id="class-Topping">
    <rect x="40" y="620" width="240" height="164" class="uml-box" rx="2" />
    <line x1="40" y1="654" x2="280" y2="654" class="uml-divider" />
    <line x1="40" y1="746" x2="280" y2="746" class="uml-divider" />
